name: load
on:
  push:
    branches: [main]
    paths: ['tests/load/**', '.github/workflows/load.yml']
  workflow_dispatch:
concurrency: { group: load, cancel-in-progress: true }
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/load/load.js
        env:
          MODE: ${{ hashFiles('tests/load/BIG') != '' && 'big' || '' }}
