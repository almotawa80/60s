name: e2e
on:
  push:
    branches: [main]
    paths: ['app.js', 'style.css', 'index.html', 'config.js', 'sw.js', 'tests/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
concurrency: { group: e2e, cancel-in-progress: true }
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-report, path: tests/report, retention-days: 7 }
