<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تحدّي الدقيقة</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;font:17px/1.6 -apple-system,"SF Arabic",system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));box-sizing:border-box}
h1{font-size:22px;font-weight:800;margin:16px 0 6px}
p{margin:0 0 24px;color:#C7C7CC;max-width:320px}
button{font:inherit;font-size:18px;font-weight:700;color:#fff;background:#C8102E;border:0;border-radius:14px;padding:14px 36px;min-height:52px;box-shadow:0 5px 0 #8E0B21}
.logo{width:96px;height:96px;border-radius:22px}
</style>
</head>
<body>
<main>
<img class="logo" src="icon.png" alt="">
<h1>ما في إنترنت</h1>
<p>تأكد من الواي فاي أو بيانات الجوال، وجرّب مرة ثانية.</p>
<button onclick="location.replace('https://beat60s.com/')">جرّب مرة ثانية</button>
</main>
<script>addEventListener("online",function(){location.replace("https://beat60s.com/")});</script>
</body>
</html>
